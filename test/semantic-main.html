<!doctype html><html><head><meta charset="utf-8"><title>Owned semantic automation controls</title>
<style>#display-hidden{display:none}.invisible{visibility:hidden}.visible-again{visibility:visible}</style></head><body>
<h1>Independent semantic controls</h1><p id="description">Actual label and state fixture.</p>
<form id="actual-form" action="/submit?owned=1" method="post">
<label for="email">Email from actual label</label><input id="email" name="email" type="email" required placeholder="mail fixture" value="first@example.test">
<label><input id="check" name="check" type="checkbox" value="yes">Actual checkbox label</label>
<label for="choice">Choose actual option</label><select id="choice" name="choice"><option value="a">First choice</option><option value="b" selected>Second choice</option></select>
<textarea id="note" name="note" placeholder="Actual notes">Initial note</textarea>
<input id="concealed" name="concealed" type="hidden" value="hidden form state"><input id="password" name="password" type="password" value="synthetic-not-a-secret">
<fieldset disabled><legend>Disabled group</legend><input id="disabled-field" name="disabled-field" value="disabled value"></fieldset>
<button id="submit" type="submit">Save actual form</button></form>
<label for="outside">Outside form label</label><input id="outside" form="actual-form" name="outside" value="outside association">
<button id="plain" aria-label="Original action" aria-describedby="description">Original visible button</button>
<span id="role-label">Role label</span><div id="role-button" role="button" tabindex="0" aria-labelledby="role-label" aria-pressed="false">Role button contents</div>
<a id="actual-link" href="/destination?actual=1">Actual link</a><div id="listener">Listener action</div><div id="focusable" tabindex="0">Focusable div</div>
<button id="html-hidden" hidden>HTML hidden action</button><div id="display-hidden"><button id="css-hidden">CSS hidden action</button></div>
<div aria-hidden="true"><button id="aria-hidden">ARIA hidden action</button></div>
<div class="invisible"><button id="invisible">Invisible action</button><button class="visible-again" id="visible-again">Visible descendant</button></div>
<ol id="list"><li>First actual list item</li><li>Second actual list item</li></ol>
<div id="shadow-host"><button id="slotted" slot="actual-slot">Slotted action</button></div>
<iframe id="child" src="/frame"></iframe>
<script>
globalThis.semanticSetupErrors=[];
try{const host=document.getElementById('shadow-host');const root=host.attachShadow({mode:'open'});root.innerHTML='<label id="shadow-label" for="shadow-input">Shadow label</label><input id="shadow-input"><button id="shadow-action" aria-label="Shadow action">Shadow contents</button><slot name="actual-slot"></slot>';globalThis.heldShadow=root.querySelector('#shadow-action');}catch(error){semanticSetupErrors.push({name:error.name,message:error.message});}
globalThis.listenerActivations=0;document.getElementById('listener').addEventListener('click',()=>{listenerActivations++;});
globalThis.heldButton=document.getElementById('plain');globalThis.semanticReady=true;
</script></body></html>
