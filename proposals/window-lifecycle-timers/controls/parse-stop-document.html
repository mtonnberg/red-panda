<!doctype html>
<script defer src="/defer.js" onerror="window.deferErrored=true;window.order.push('defer-error')"></script>
<script>
window.order=[];
window.stop();
window.during=document.readyState;
setTimeout(()=>{window.timerFired=true;window.order.push('timer')},0);
window.stop();
addEventListener('load',()=>{window.order.push('load');window.loaded={during,ready:document.readyState,timer:window.timerFired===true,defer:window.deferErrored===true,ran:window.deferRan===true,order:window.order.slice()}});
</script>
